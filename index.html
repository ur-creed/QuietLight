<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="twitter:description" content="Your AI companion for mindfulness and meditation. Download now on iOS and Android." />
  <meta name="twitter:image" content="https://quietlight.app/images/icon.png" />
  <meta name="twitter:image:alt" content="Quiet Light App Icon" />
  
  <!-- Canonical URL -->
  <link rel="canonical" href="https://quietlight.app/" />
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/images/favicon.png">
  <link rel="apple-touch-icon" href="/images/icon.png" />
  
  <!-- Preconnect to External Domains -->
  <link rel="preconnect" href="https://apps.apple.com" />
  <link rel="preconnect" href="https://play.google.com" />
  
  <title>Quiet Light - AI Companion for Mindfulness & Meditation App</title>
  
  <!-- Structured Data - JSON-LD for App and Organization -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "Quiet Light",
    "description": "An AI companion for mindfulness and meditation",
    "url": "https://quietlight.app",
    "image": "https://quietlight.app/images/icon.png",
    "applicationCategory": "HealthAndFitnessApplication",
    "operatingSystem": "iOS, Android",
    "offers": {
      "@type": "Offer",
      "price": "0",
      "priceCurrency": "USD"
    },
    "aggregateRating": {
      "@type": "AggregateRating",
      "ratingValue": "4.8",
      "ratingCount": "1250"
    }
  }
  </script>
  
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "Quiet Light",
    "url": "https://quietlight.app",
    "logo": "https://quietlight.app/images/icon.png",
    "description": "AI companion for mindfulness",
    "sameAs": [
      "https://apps.apple.com/us/app/quiet-light-illuminations/id6759539902",
      "https://play.google.com/store/apps/details?id=host.exp.exponent"
    ],
    "contactPoint": {
      "@type": "ContactPoint",
      "contactType": "Customer Support",
      "email": "support@quietlight.app"
    }
  }
  </script>
  
  <style>
    :root {
      --text: #1A1A1A;
      --text-secondary: #8A8A8A;
      --button-text: #FFFFFF;
      --link: #1A1A1A;
      --background-root: #FAFAF7;
      --background-default: #FFFFFF;
      --background-secondary: #F5F5F0;
      --background-tertiary: #EBEBEB;
      --accent: #D4D4D0;
      --border: #E8E8E5;

      --spacing-xl: 32px;
      --spacing-lg: 24px;
      --spacing-md: 16px;
      --spacing-sm: 12px;
      --spacing-xs: 8px;
      --spacing-3xl: 48px;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--background-root);
      color: var(--text);
    }

    #root {
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: var(--spacing-lg) var(--spacing-xl);
      max-width: 900px;
      margin: 0 auto;
    }

    .wrapper {
      width: 100%;
      text-align: center;
    }

    .loading {
      position: fixed;
      inset: 0;
      background: var(--background-root);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      transition: opacity 0.6s ease;
    }

    .loading.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 5px solid var(--accent);
      border-top: 5px solid var(--text);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: var(--spacing-md);
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .loading-text {
      font-size: 1.1rem;
      color: var(--text-secondary);
    }

    .content {
      opacity: 0;
      transition: opacity 0.8s ease;
      width: 100%;
    }

    .content.visible {
      opacity: 1;
    }

    .app-icon {
      width: 120px;
      height: 120px;
      border-radius: 28px;
      margin: 0 auto var(--spacing-lg);
      display: block;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    }

    h1 {
      font-size: 2.8rem;
      font-weight: 700;
      margin: 0 0 var(--spacing-sm);
      color: var(--text);
    }

    .subtitle {
      font-size: 1.25rem;
      color: var(--text-secondary);
      margin: 0 0 var(--spacing-xl);
    }

    .download-prompt {
      font-size: 1.4rem;
      font-weight: 500;
      color: var(--text);
      margin: var(--spacing-lg) 0 var(--spacing-md);
    }

    .divider {
      height: 1px;
      background: var(--border);
      margin: var(--spacing-xl) auto;
      max-width: 120px;
    }

    .store-buttons-wrapper {
      position: relative;
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
    }

    .store-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: var(--spacing-md);
      justify-content: center;
    }

    .store-button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 24px;
      background: var(--background-default);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      text-decoration: none;
      font-weight: 500;
      transition: all 0.2s;
      cursor: pointer;
    }

    .store-button:hover {
      background: var(--background-secondary);
      border-color: var(--text);
      transform: translateY(-2px);
    }

    .store-button.disabled {
      filter: blur(1.5px) opacity(0.6);
      pointer-events: none;
    }

    .store-icon {
      width: 20px;
      height: 20px;
    }

    .coming-soon-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(250, 250, 247, 0.4);
      border-radius: 12px;
      pointer-events: all;
      z-index: 5;
    }

    .coming-soon-overlay.hidden {
      display: none;
    }

    .coming-soon-text {
      font-size: 2.2rem;
      font-weight: 700;
      color: rgba(26, 26, 26, 0.7);
      text-align: center;
      letter-spacing: 1px;
      text-transform: uppercase;
      transform: rotate(-12deg);
      text-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }

    .version-info {
      font-size: 0.95rem;
      color: var(--text-secondary);
      margin-top: var(--spacing-lg);
      opacity: 0.85;
    }

    footer {
      padding: var(--spacing-lg) var(--spacing-xl);
      background: var(--background-secondary);
      border-top: 1px solid var(--border);
      text-align: center;
      color: var(--text-secondary);
      font-size: 0.95rem;
    }

    .footer-links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: var(--spacing-md);
      margin-bottom: var(--spacing-sm);
    }

    .footer-links a {
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 0.95rem;
      transition: color 0.2s;
    }

    .footer-links a:hover {
      color: var(--text);
      text-decoration: underline;
    }

    @media (max-width: 600px) {
      main {
        padding: var(--spacing-lg) var(--spacing-lg);
      }
      h1 {
        font-size: 2.4rem;
      }
      .app-icon {
        width: 100px;
        height: 100px;
      }
      .coming-soon-text {
        font-size: 1.8rem;
      }
    }

    @media (max-height: 700px) {
      .app-icon { width: 90px; height: 90px; }
      h1 { font-size: 2.2rem; }
      .subtitle { font-size: 1.1rem; }
      footer { padding: var(--spacing-md) var(--spacing-lg); }
    }
  </style>
</head>
<body>
  <div id="root">
    <main>
      <div class="wrapper">
        <div class="loading" id="loading" aria-label="Loading content">
          <div class="spinner" aria-hidden="true"></div>
          <div class="loading-text">Loading with peace...</div>
        </div>

        <div class="content" id="content">
          <img 
            src="images/icon.png" 
            alt="Quiet Light - AI Companion for Mindfulness App" 
            class="app-icon" 
            width="120" 
            height="120"
            loading="eager"
          />
          <h1>Quiet Light</h1>
          <p class="subtitle">AI companion for mindfulness and meditation</p>
          <div class="divider" aria-hidden="true"></div>

          <h2 class="download-prompt">Download the app</h2>

          <div class="store-buttons-wrapper">
            <div class="store-buttons">
              <a
                id="app-store-btn"
                href="https://apps.apple.com/us/app/quiet-light-illuminations/id6759539902"
                class="store-button"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Download Quiet Light on Apple App Store"
              >
                <svg class="store-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                  <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.63-.02 3.02.88 3.97 2.12.25.35.51.68.77.99.26-.3.52-.64.77-.99.95-1.24 2.33-2.14 3.97-2.12 1.69.02 3.25 1 4.12 2.51 1.76 3.06.46 7.55-1.1 9.88-1.44 1.84-3.27 3.21-5.39 2.51-.63-.19-1.17-.48-1.6-.9-.39.42-.93.71-1.6.9zm-9.5-9c-.83-1.65-1.48-2.14-2.07-2.13-.59.01-1.24.5-2.07 2.13-.35.72-.69 1.44-1.02 2.16.95.47 1.98.69 3.09.69s2.14-.22 3.09-.69c-.33-.72-.67-1.44-1.02-2.16z"/>
                </svg>
                App Store
              </a>
              <div class="store-button disabled" style="position: relative;">
                <svg class="store-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                  <path d="M3,20.5V3.5C3,2.91 3.34,2.39 3.84,2.15L13.69,12L3.84,21.85C3.34,21.6 3,21.09 3,20.5M16.81,15.12L6.05,21.34L14.54,12.85L16.81,15.12M20.16,10.81C20.5,11.08 20.75,11.5 20.75,12C20.75,12.5 20.5,12.92 20.16,13.19L16.81,15.88C15.71,16.68 14.05,16.68 12.95,15.88L12.5,15.54V12.46L12.95,12.12C14.05,11.32 15.71,11.32 16.81,12.12L20.16,10.81Z"/>
                </svg>
                Google Play
              </div>
            </div>

            <!-- Coming Soon overlay for Google Play only -->
            <div class="coming-soon-overlay" id="coming-soon-overlay" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 140px; height: 50px; border-radius: 12px; pointer-events: none;">
              <div class="coming-soon-text" style="font-size: 1.4rem; transform: rotate(-8deg);">Coming Soon</div>
            </div>
          </div>

          <p class="version-info">Current Version: 1.0.0</p>
        </div>
      </div>
    </main>

    <footer>
      <nav class="footer-links">
        <a href="about.html" rel="alternate">About</a>
        <a href="privacy.html" rel="legal">Privacy Policy</a>
        <a href="terms.html" rel="legal">Terms of Service</a>
        <a href="mailto:support@quietlight.app">Support</a>
      </nav>
    </footer>
  </div>

  <script>
    window.addEventListener('load', () => {
      const loading = document.getElementById('loading');
      const content = document.getElementById('content');
      loading.classList.add('hidden');
      setTimeout(() => {
        content.classList.add('visible');
      }, 600);
    });
  </script>
</body>
</html>
