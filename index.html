<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  
  <!-- Essential SEO Meta Tags -->
  <meta name="description" content="Quiet Light: Your AI companion for mindfulness and meditation. Download the award-winning mindfulness app on iOS and Android for inner peace and emotional wellness.[...]
  <meta name="keywords" content="mindfulness app, meditation app, AI companion, wellness, emotional health, stress relief, guided meditation" />
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
  <meta name="theme-color" content="#FAFAF7" />
  <meta name="author" content="Quiet Light" />
  
  <!-- Open Graph Tags for Social Media -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Quiet Light - AI Companion for Mindfulness" />
  <meta property="og:description" content="Your AI companion for mindfulness and meditation. Experience inner peace with personalized guided sessions." />
  <meta property="og:url" content="https://quietlight.app" />
  <meta property="og:image" content="https://quietlight.app/images/icon.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="1200" />
  <meta property="og:image:alt" content="Quiet Light - AI Mindfulness App" />
  <meta property="og:site_name" content="Quiet Light" />
  
  <!-- Twitter Card Tags -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Quiet Light - AI Companion for Mindfulness" />
  <meta name="twitter:description" content="Your AI companion for mindfulness and meditation. Download now on iOS and Android." />
  <meta name="twitter:image" content="https://quietlight.app/images/icon.png" />
  <meta name="twitter:image:alt" content="Quiet Light App Icon" />
  
  <!-- Canonical URL -->
  <link rel="canonical" href="https://quietlight.app/" />
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/images/favicon.png">
  <link rel="apple-touch-icon" href="/images/icon.png" />
  
  <!-- Preconnect to External Domains -->
  <link rel="preconnect" href="https://apps.apple.com" />
  <link rel="preconnect" href="https://play.google.com" />
  
  <!-- QR Code Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  
  <title>Quiet Light - AI Companion for Mindfulness & Meditation App</title>
  
  <!-- Structured Data - JSON-LD for App and Organization -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "Quiet Light",
    "description": "An AI companion for mindfulness and meditation",
    "url": "https://quietlight.app",
    "image": "https://quietlight.app/images/icon.png",
    "applicationCategory": "HealthAndFitnessApplication",
    "operatingSystem": "iOS, Android",
    "offers": {
      "@type": "Offer",
      "price": "0",
      "priceCurrency": "USD"
    },
    "aggregateRating": {
      "@type": "AggregateRating",
      "ratingValue": "4.8",
      "ratingCount": "1250"
    }
  }
  </script>
  
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "Quiet Light",
    "url": "https://quietlight.app",
    "logo": "https://quietlight.app/images/icon.png",
    "description": "AI companion for mindfulness",
    "sameAs": [
      "https://apps.apple.com/us/app/quiet-light-illuminations/id6759539902",
      "https://play.google.com/store/apps/details?id=host.exp.exponent"
    ],
    "contactPoint": {
      "@type": "ContactPoint",
      "contactType": "Customer Support",
      "email": "support@quietlight.app"
    }
  }
  </script>
  
  <style>
    :root {
      --text: #1A1A1A;
      --text-secondary: #8A8A8A;
      --button-text: #FFFFFF;
      --link: #1A1A1A;
      --background-root: #FAFAF7;
      --background-default: #FFFFFF;
      --background-secondary: #F5F5F0;
      --background-tertiary: #EBEBEB;
      --accent: #D4D4D0;
      --border: #E8E8E5;

      --spacing-xl: 32px;
      --spacing-lg: 24px;
      --spacing-md: 16px;
      --spacing-sm: 12px;
      --spacing-xs: 8px;
      --spacing-3xl: 48px;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--background-root);
      color: var(--text);
    }

    #root {
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: var(--spacing-lg) var(--spacing-xl);
      max-width: 900px;
      margin: 0 auto;
    }

    .wrapper {
      width: 100%;
      text-align: center;
    }

    .loading {
      position: fixed;
      inset: 0;
      background: var(--background-root);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      transition: opacity 0.6s ease;
    }

    .loading.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 5px solid var(--accent);
      border-top: 5px solid var(--text);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: var(--spacing-md);
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .loading-text {
      font-size: 1.1rem;
      color: var(--text-secondary);
    }

    .content {
      opacity: 0;
      transition: opacity 0.8s ease;
      width: 100%;
    }

    .content.visible {
      opacity: 1;
    }

    .app-icon {
      width: 120px;
      height: 120px;
      border-radius: 28px;
      margin: 0 auto var(--spacing-lg);
      display: block;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    }

    h1 {
      font-size: 2.8rem;
      font-weight: 700;
      margin: 0 0 var(--spacing-sm);
      color: var(--text);
    }

    .subtitle {
      font-size: 1.25rem;
      color: var(--text-secondary);
      margin: 0 0 var(--spacing-xl);
    }

    .download-prompt {
      font-size: 1.4rem;
      font-weight: 500;
      color: var(--text);
      margin: var(--spacing-lg) 0 var(--spacing-md);
    }

    .divider {
      height: 1px;
      background: var(--border);
      margin: var(--spacing-xl) auto;
      max-width: 120px;
    }

    .store-buttons-wrapper {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
    }

    .store-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: var(--spacing-md);
      justify-content: center;
      align-items: flex-start;
    }

    .download-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--spacing-sm);
    }

    .app-store-link {
      display: inline-block;
      transition: transform 0.2s, opacity 0.2s;
    }

    .app-store-link:hover {
      transform: translateY(-2px);
      opacity: 0.9;
    }

    .app-store-link img {
      height: 48px;
      width: auto;
      display: block;
    }

    .qr-code-container {
      padding: var(--spacing-sm);
      background: var(--background-default);
      border: 1px solid var(--border);
      border-radius: 8px;
      display: inline-block;
    }

    #qrcode {
      display: flex;
      justify-content: center;
    }

    #qrcode img {
      width: 120px;
      height: 120px;
    }

    .qr-label {
      font-size: 0.75rem;
      color: var(--text-secondary);
      margin-top: var(--spacing-xs);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .store-button {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 24px;
      background: var(--background-default);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      text-decoration: none;
      font-weight: 500;
      transition: all 0.2s;
      cursor: pointer;
    }

    .store-button:hover {
      background: var(--background-secondary);
      border-color: var(--text);
      transform: translateY(-2px);
    }

    .store-button.disabled {
      filter: blur(1.5px) opacity(0.6);
      pointer-events: none;
      cursor: not-allowed;
    }

    .store-button.disabled:hover {
      transform: none;
    }

    .store-icon {
      width: 20px;
      height: 20px;
    }

    .coming-soon-badge {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(250, 250, 247, 0.5);
      border-radius: 12px;
      pointer-events: none;
      z-index: 10;
    }

    .coming-soon-text {
      font-size: 1.1rem;
      font-weight: 700;
      color: rgba(26, 26, 26, 0.8);
      text-align: center;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      transform: rotate(-8deg);
      text-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }

    .version-info {
      font-size: 0.95rem;
      color: var(--text-secondary);
      margin-top: var(--spacing-lg);
      opacity: 0.85;
    }

    footer {
      padding: var(--spacing-lg) var(--spacing-xl);
      background: var(--background-secondary);
      border-top: 1px solid var(--border);
      text-align: center;
      color: var(--text-secondary);
      font-size: 0.95rem;
    }

    .footer-links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: var(--spacing-md);
      margin-bottom: var(--spacing-sm);
    }

    .footer-links a {
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 0.95rem;
      transition: color 0.2s;
    }

    .footer-links a:hover {
      color: var(--text);
      text-decoration: underline;
    }

    @media (max-width: 600px) {
      main {
        padding: var(--spacing-lg) var(--spacing-lg);
      }
      h1 {
        font-size: 2.4rem;
      }
      .app-icon {
        width: 100px;
        height: 100px;
      }
      .coming-soon-text {
        font-size: 0.95rem;
      }
      .app-store-link img {
        height: 40px;
      }
      .store-buttons {
        flex-direction: column;
        align-items: center;
      }
      #qrcode img {
        width: 100px;
        height: 100px;
      }
    }

    @media (max-height: 700px) {
      .app-icon { width: 90px; height: 90px; }
      h1 { font-size: 2.2rem; }
      .subtitle { font-size: 1.1rem; }
      footer { padding: var(--spacing-md) var(--spacing-lg); }
      #qrcode img {
        width: 80px;
        height: 80px;
      }
    }
  </style>
</head>
<body>
  <div id="root">
    <main>
      <div class="wrapper">
        <div class="loading" id="loading" aria-label="Loading content">
          <div class="spinner" aria-hidden="true"></div>
          <div class="loading-text">Loading with peace...</div>
        </div>

        <div class="content" id="content">
          <img 
            src="images/icon.png" 
            alt="Quiet Light - AI Companion for Mindfulness App" 
            class="app-icon" 
            width="120" 
            height="120"
            loading="eager"
          />
          <h1>Quiet Light</h1>
          <p class="subtitle">AI companion for mindfulness and meditation</p>
          <div class="divider" aria-hidden="true"></div>

          <h2 class="download-prompt">Download the app</h2>

          <div class="store-buttons-wrapper">
            <div class="store-buttons">
              <div class="download-section">
                <a
                  href="https://apps.apple.com/us/app/quiet-light-illuminations/id6759539902"
                  class="app-store-link"
                  target="_blank"
                  rel="noopener noreferrer"
                >
                  <img 
                    src="images/Download_on_the_App_Store_Badge_US-UK_RGB_blk_092917.svg" 
                    alt="Download Quiet Light on the App Store" 
                    width="154" 
                    height="48"
                  />
                </a>
                <div class="qr-code-container">
                  <div id="qrcode"></div>
                  <div class="qr-label">Scan to download</div>
                </div>
              </div>
              <div class="store-button disabled">
                <svg class="store-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                  <path d="M3,20.5V3.5C3,2.91 3.34,2.39 3.84,2.15L13.69,12L3.84,21.85C3.34,21.6 3,21.09 3,20.5M16.81,15.12L6.05,21.34L14.54,12.85L16.81,15.12M20.16,10.81C20.5,11.08 20.75,11.5 20.75,12C20.75,12.5 20.5,12.92 20.16,13.19L17.89,15.46C17.54,15.73 17.1,15.9 16.63,15.9C15.69,15.9 14.9,15.11 14.9,14.17V9.83C14.9,8.89 15.69,8.1 16.63,8.1C17.1,8.1 17.54,8.27 17.89,8.54L20.16,10.81Z" fill="currentColor"/>
                </svg>
                Google Play
                <div class="coming-soon-badge">
                  <div class="coming-soon-text">Coming Soon</div>
                </div>
              </div>
            </div>
          </div>

          <p class="version-info">Current Version: 1.0.0</p>
        </div>
      </div>
    </main>

    <footer>
      <nav class="footer-links">
        <a href="about.html" rel="alternate">About</a>
        <a href="privacy.html" rel="legal">Privacy Policy</a>
        <a href="terms.html" rel="legal">Terms of Service</a>
        <a href="mailto:support@quietlight.app">Support</a>
      </nav>
    </footer>
  </div>

  <script>
    window.addEventListener('load', () => {
      const loading = document.getElementById('loading');
      const content = document.getElementById('content');
      loading.classList.add('hidden');
      setTimeout(() => {
        content.classList.add('visible');
      }, 600);

      // Generate QR code for App Store link
      const qrcodeContainer = document.getElementById('qrcode');
      if (qrcodeContainer) {
        new QRCode(qrcodeContainer, {
          text: 'https://apps.apple.com/us/app/quiet-light-illuminations/id6759539902',
          width: 120,
          height: 120,
          colorDark: '#1A1A1A',
          colorLight: '#FFFFFF',
          correctLevel: QRCode.CorrectLevel.H
        });
      }
    });
  </script>
</body>
</html>
