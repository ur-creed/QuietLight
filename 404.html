<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" href="/images/favicon.png">
  <title>Not found – Quiet Light</title>
  <style>
    :root {
      --text: #1A1A1A;
      --text-secondary: #8A8A8A;
      --background-root: #FAFAF7;
      --background-secondary: #F5F5F0;
      --border: #E8E8E5;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--background-root);
      color: var(--text);
      line-height: 1.7;
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
      text-align: center;
    }

    .code {
      font-size: 0.8rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--text-secondary);
      margin-bottom: 24px;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 500;
      margin: 0 0 16px;
      color: var(--text);
    }

    .body {
      max-width: 400px;
      font-size: 1.05rem;
      color: var(--text-secondary);
      margin: 0 0 40px;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 16px 24px;
      justify-content: center;
    }

    .links a {
      color: var(--text);
      text-decoration: none;
      font-size: 0.95rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 2px;
      transition: border-color 0.2s ease;
    }

    .links a:hover {
      border-bottom-color: var(--text);
    }

    footer {
      padding: 20px 24px;
      background: var(--background-secondary);
      border-top: 1px solid var(--border);
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-secondary);
    }
  </style>
</head>
<body>
  <main>
    <p class="code">404</p>
    <h1>This path has no answer</h1>
    <p class="body">
      Only a gentle invitation to return — to stillness, to home, or to a quiet pause along the way.
    </p>
    <nav class="links">
      <a href="/">Home</a>
      <a href="/about.html">About</a>
      <a href="/pause.html">Pause</a>
    </nav>
  </main>

  <footer>
    Stillness is already complete.
  </footer>
</body>
</html>
